<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="980" viewBox="0 0 1160 980" font-family="Segoe UI, DejaVu Sans, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6A6A6A"/></marker></defs>
<rect width="1160" height="980" fill="#161616"/>
<text x="40" y="48" font-size="26" font-weight="700" fill="#FFFFFF">PausaPatch — logical flow</text>
<text x="40" y="74" font-size="14" fill="#8F8F8F">Detection runs on a timer; protection actions run as SYSTEM through a temporary scheduled task.</text>
<text x="40" y="118" font-size="13" font-weight="700" fill="#4CC2FF" letter-spacing="1">STARTUP &amp; MONITORING</text>
<rect x="40" y="132" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="290.0" y="166" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">App starts</text>
<text x="290.0" y="190" text-anchor="middle" font-size="14" fill="#A8A8A8">single-instance mutex</text>
<rect x="40" y="232" width="500" height="66" rx="14" fill="#232323" stroke="#FFB900" stroke-width="2"/>
<text x="290.0" y="266" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Already running?</text>
<text x="290.0" y="290" text-anchor="middle" font-size="14" fill="#A8A8A8">focus the existing window and exit</text>
<rect x="40" y="332" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="290.0" y="366" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Load settings and language</text>
<text x="290.0" y="390" text-anchor="middle" font-size="14" fill="#A8A8A8">settings.json · OS locale fallback to English</text>
<rect x="40" y="432" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="290.0" y="466" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Start tray icon and timers</text>
<text x="290.0" y="490" text-anchor="middle" font-size="14" fill="#A8A8A8">tray thread · poll timer</text>
<rect x="40" y="532" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="290.0" y="566" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Every poll interval: read system state</text>
<text x="290.0" y="590" text-anchor="middle" font-size="14" fill="#A8A8A8">services · DLLs · policy · scheduled tasks</text>
<rect x="40" y="632" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="290.0" y="666" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">State changed?</text>
<rect x="40" y="732" width="500" height="66" rx="14" fill="#232323" stroke="#4CC2FF" stroke-width="2"/>
<text x="290.0" y="766" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Queue and show notification</text>
<text x="290.0" y="790" text-anchor="middle" font-size="14" fill="#A8A8A8">independent topmost window, explicit close</text>
<line x1="290.0" y1="198" x2="290.0" y2="232" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290.0" y1="298" x2="290.0" y2="332" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.0" y="309.0" font-size="13" fill="#8F8F8F">no</text>
<line x1="290.0" y1="398" x2="290.0" y2="432" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290.0" y1="498" x2="290.0" y2="532" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290.0" y1="598" x2="290.0" y2="632" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="290.0" y1="698" x2="290.0" y2="732" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.0" y="709.0" font-size="13" fill="#8F8F8F">yes</text>
<path d="M 40 665 L 16 665 L 16 565 L 40 565" fill="none" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="22" y="620" font-size="13" fill="#8F8F8F">no</text>
<text x="620" y="118" font-size="13" font-weight="700" fill="#6CCB5F" letter-spacing="1">PROTECTION ACTION</text>
<rect x="620" y="132" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="870.0" y="166" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">User toggles protection</text>
<text x="870.0" y="190" text-anchor="middle" font-size="14" fill="#A8A8A8">pause or resume</text>
<rect x="620" y="232" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="870.0" y="266" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Create temporary scheduled task</text>
<text x="870.0" y="290" text-anchor="middle" font-size="14" fill="#A8A8A8">PausaPatch-Apply · /RU SYSTEM · /RL HIGHEST</text>
<rect x="620" y="332" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="870.0" y="366" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">SYSTEM runs this binary (--apply)</text>
<text x="870.0" y="390" text-anchor="middle" font-size="14" fill="#A8A8A8">SCM · registry · takeown/icacls · schtasks</text>
<rect x="620" y="432" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="870.0" y="466" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Retry failed tasks as administrator</text>
<text x="870.0" y="490" text-anchor="middle" font-size="14" fill="#A8A8A8">only tasks SYSTEM cannot change</text>
<rect x="620" y="532" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="870.0" y="566" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Wait for done marker, delete task</text>
<text x="870.0" y="590" text-anchor="middle" font-size="14" fill="#A8A8A8">__done: ok | error</text>
<rect x="620" y="632" width="500" height="66" rx="14" fill="#232323" stroke="#3C3C3C" stroke-width="2"/>
<text x="870.0" y="666" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Verify real state (up to 25 s)</text>
<text x="870.0" y="690" text-anchor="middle" font-size="14" fill="#A8A8A8">poll until the state matches the target</text>
<rect x="620" y="732" width="500" height="66" rx="14" fill="#232323" stroke="#6CCB5F" stroke-width="2"/>
<text x="870.0" y="766" text-anchor="middle" font-size="17" font-weight="600" fill="#EDEDED">Confirmed: update UI and tray</text>
<text x="870.0" y="790" text-anchor="middle" font-size="14" fill="#A8A8A8">status rows · icon colour · error bar</text>
<line x1="870.0" y1="198" x2="870.0" y2="232" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="870.0" y1="298" x2="870.0" y2="332" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="870.0" y1="398" x2="870.0" y2="432" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="870.0" y1="498" x2="870.0" y2="532" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="870.0" y1="598" x2="870.0" y2="632" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="870.0" y1="698" x2="870.0" y2="732" stroke="#6A6A6A" stroke-width="2" marker-end="url(#arrow)"/>
<text x="880.0" y="709.0" font-size="13" fill="#8F8F8F">ok</text>
<path d="M 1120 665 L 1136 665 L 1136 865 L 1120 865" fill="none" stroke="#FFB900" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1030" y="656" font-size="13" fill="#FFB900">mismatch</text>
<rect x="620" y="832" width="500" height="66" rx="14" fill="#232323" stroke="#FFB900" stroke-width="2"/><text x="870" y="866" text-anchor="middle" font-size="17" font-weight="600" fill="#FFB900">Mismatch: error bar, retry next poll</text><text x="870" y="890" text-anchor="middle" font-size="14" fill="#A8A8A8">the action did not reach the expected state</text>
<text x="40" y="940" font-size="13" font-weight="700" fill="#8F8F8F" letter-spacing="1">TRAY</text>
<text x="95" y="940" font-size="14" fill="#A8A8A8">double-click toggles the window · menu: Show / Pause / Resume / Exit · closing the window hides it and monitoring continues</text>
</svg>